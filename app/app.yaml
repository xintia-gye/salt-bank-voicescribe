# Databricks App config for Salt Bank VoiceScribe.
#
# The FastAPI backend serves both the REST API (/api/*) and the built React
# SPA (frontend/dist). Uvicorn binds to the port Databricks injects via $PORT
# (falls back to 8000 locally).
#
# DATABRICKS_HOST and the service-principal OAuth creds
# (DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET) are injected automatically
# by the Apps runtime, so they are NOT listed here. The SQL warehouse id is
# provided via the `sql-warehouse` app resource (add it in the App UI /
# bundle and it is exposed as DATABRICKS_WAREHOUSE_ID).

command:
  - uvicorn
  - backend.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  # SQL warehouse to query. The warehouse id is not a secret, so it is set
  # directly here for a self-contained deploy. Alternatively attach a
  # "sql-warehouse" app resource and use `valueFrom: sql-warehouse`.
  - name: DATABRICKS_WAREHOUSE_ID
    value: "148ccb90800933a1"
  - name: DATABRICKS_CATALOG
    value: salt_bank_voicescribe
  - name: DATABRICKS_SCHEMA
    value: voicescribe
  - name: INGEST_ADAPTER
    value: synthetic
  # Genie space (Layer 5) for supervisor natural-language analytics.
  - name: GENIE_SPACE_ID
    value: "01f1b52b26c11cacb12269806671aa8e"
  # Lakebase (Layer 2) — operational store for approval/edit workflow state.
  # Attach a "database" app resource pointing at the voicescribe-oltp instance;
  # it injects PGHOST/PGUSER/PGDATABASE/PGPORT. LAKEBASE_INSTANCE is the
  # fallback used to look up the host + mint credentials via the SDK.
  - name: LAKEBASE_INSTANCE
    value: voicescribe-oltp
  # Postgres role = the app service principal's client id (registered as a
  # DATABRICKS_SUPERUSER role on the instance). Set explicitly so the DB user
  # is correct even if DATABRICKS_CLIENT_ID resolution differs.
  - name: PGUSER
    value: "9e31c274-1462-43c6-b381-79aa5909ed91"
  # When you provision Twilio, set INGEST_ADAPTER=twilio and add TWILIO_AUTH_TOKEN
  # as a secret-backed resource, e.g.:
  # - name: TWILIO_AUTH_TOKEN
  #   valueFrom: twilio-auth-token
